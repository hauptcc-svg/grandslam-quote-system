<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Your Court — Grand Slam Surfacing</title>
  <style>
    :root { --green:#1a8a3f; --green-dark:#0f5c28; --grey-200:#e5e7eb; --grey-700:#374151; --grey-900:#111827; --white:#fff; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',-apple-system,sans-serif; background:var(--white); display:flex; justify-content:center; align-items:center; min-height:100vh; padding:16px; }
    .embed { max-width:360px; width:100%; background:var(--white); border:2px solid var(--grey-200); border-radius:12px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.08); }
    .embed-header { background:var(--grey-900); color:var(--white); text-align:center; padding:10px 14px; font-family:'Montserrat',sans-serif; font-weight:800; font-size:13px; letter-spacing:0.5px; }
    .embed-body { padding:12px; }
    .embed-label { font-size:10px; font-weight:600; color:var(--grey-700); text-transform:uppercase; margin-bottom:6px; letter-spacing:0.3px; }
    .court-types { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:12px; }
    .ct-btn { padding:8px 4px; border:2px solid var(--grey-200); border-radius:8px; background:var(--white); cursor:pointer; font-size:10px; font-weight:600; text-align:center; transition:all 0.15s; font-family:'Inter',sans-serif; }
    .ct-btn:hover { border-color:var(--green); }
    .ct-btn.selected { border-color:var(--green); background:#e8f5e9; color:var(--green-dark); }
    .ct-icon { font-size:20px; display:block; margin-bottom:2px; }
    .colour-picker { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px; }
    .col-btn { display:flex; align-items:center; gap:8px; padding:8px; border:2px solid var(--grey-200); border-radius:8px; background:var(--white); cursor:pointer; font-family:'Inter',sans-serif; transition:all 0.15s; }
    .col-btn:hover { border-color:var(--green); }
    .col-btn.selected { border-color:var(--green); background:#e8f5e9; }
    .col-dot { width:24px; height:24px; border-radius:50%; border:1px solid rgba(0,0,0,0.1); flex-shrink:0; }
    .col-name { font-size:11px; font-weight:600; }
    .preview { border:1px solid var(--grey-200); border-radius:8px; overflow:hidden; margin-bottom:12px; }
    .preview svg { display:block; width:100%; height:auto; }
    .cta { display:block; width:100%; padding:12px; background:var(--green); color:var(--white); border:none; border-radius:8px; font-family:'Montserrat',sans-serif; font-weight:700; font-size:14px; cursor:pointer; text-align:center; text-decoration:none; transition:all 0.15s; }
    .cta:hover { background:var(--green-dark); }
    .embed-footer { text-align:center; padding:8px; font-size:9px; color:#999; }
    @media (min-width:600px) { .embed { max-width:400px; } }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="embed" id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;

const COURTS = [
  { id:'tennis', name:'Tennis', icon:'🎾', vb:'0 0 300 500', outer:[20,30,260,440], inner:[50,60,200,380], net:[50,250,200,2], svcBox1:[70,220,160,30], svcBox2:[70,280,160,30], svcLine:[150,220,2,90], singles:[90,60,120,380], label:'TENNIS', dims:'23.8m × 11m' },
  { id:'netball', name:'Netball', icon:'🏐', vb:'0 0 500 300', outer:[20,20,460,260], inner:[40,40,420,220], net:[40,150,420,2], goalCircle1:[250,40,40,40], goalCircle2:[250,220,40,40], centerCircle:[225,125,50,50], third1:[180,40,2,220], third2:[320,40,2,220], label:'NETBALL', dims:'30.5m × 15.3m' },
  { id:'basketball', name:'Basketball', icon:'🏀', vb:'0 0 300 500', outer:[15,25,270,450], inner:[35,45,230,410], net:[35,250,230,2], key1:[100,45,100,100], key2:[100,355,100,100], arc1:[150,145,40,40], arc2:[150,315,40,40], label:'BASKETBALL', dims:'28m × 15m' },
  { id:'pickleball', name:'Pickleball', icon:'🏓', vb:'0 0 300 500', outer:[40,50,220,400], inner:[50,60,200,380], net:[50,250,200,2], nvz1:[70,200,160,50], nvz2:[70,250,160,50], svcL:[150,200,2,100], label:'PICKLEBALL', dims:'13.4m × 6.1m' },
  { id:'futsal', name:'Futsal', icon:'⚽', vb:'0 0 300 500', outer:[15,25,270,450], inner:[30,40,240,420], net:[30,250,240,2], pen1:[30,130,60,120], pen2:[210,250,60,120], center:[150,250,40,40], arc1:[30,130,80,60], arc2:[190,310,80,60], label:'FUTSAL', dims:'40m × 20m' },
  { id:'combo', name:'Multi', icon:'🏟️', vb:'0 0 400 400', outer:[20,20,360,360], inner:[50,50,300,300], net:[50,200,300,2], multi:[150,50,100,300], label:'MULTI', dims:'Variable' },
];

const COLOURS = [
  { id:'green', name:'Court Green', hex:'#4CAF50' },
  { id:'terracotta', name:'Terracotta', hex:'#CC6644' },
  { id:'blue', name:'Court Blue', hex:'#2196F3' },
  { id:'red', name:'Sport Red', hex:'#E53935' },
  { id:'dark_green', name:'Dark Green', hex:'#2E7D32' },
  { id:'grey', name:'Slate Grey', hex:'#607D8B' },
];

function CourtPreview({ layout, inside, outside }) {
  if (!layout) layout = COURTS[0];
  const VB = layout.vb.split(' ').slice(2).map(Number);
  return (
    <div className="preview">
      <svg viewBox={layout.vb}>
        <rect x={layout.outer[0]} y={layout.outer[1]} width={layout.outer[2]} height={layout.outer[3]} fill={outside} rx="4"/>
        <rect x={layout.inner[0]} y={layout.inner[1]} width={layout.inner[2]} height={layout.inner[3]} fill={inside} rx="2"/>
        <rect x={layout.net[0]} y={layout.net[1]} width={layout.net[2]} height={layout.net[3]} fill="#fff" opacity="0.9"/>
        {layout.svcBox1&&<rect x={layout.svcBox1[0]} y={layout.svcBox1[1]} width={layout.svcBox1[2]} height={layout.svcBox1[3]} fill="none" stroke="#fff" strokeWidth="1.5" opacity="0.7"/>}
        {layout.svcBox2&&<rect x={layout.svcBox2[0]} y={layout.svcBox2[1]} width={layout.svcBox2[2]} height={layout.svcBox2[3]} fill="none" stroke="#fff" strokeWidth="1.5" opacity="0.7"/>}
        {layout.svcLine&&<rect x={layout.svcLine[0]} y={layout.svcLine[1]} width={layout.svcLine[2]} height={layout.svcLine[3]} fill="#fff" opacity="0.5"/>}
        {layout.singles&&<rect x={layout.singles[0]} y={layout.singles[1]} width={layout.singles[2]} height={layout.singles[3]} fill="none" stroke="#fff" strokeWidth="1" strokeDasharray="6,4" opacity="0.6"/>}
        {layout.goalCircle1&&<circle cx={layout.goalCircle1[0]} cy={layout.goalCircle1[1]} rx={layout.goalCircle1[2]} ry={layout.goalCircle1[3]} fill="none" stroke="#fff" strokeWidth="2" opacity="0.8"/>}
        {layout.goalCircle2&&<circle cx={layout.goalCircle2[0]} cy={layout.goalCircle2[1]} rx={layout.goalCircle2[2]} ry={layout.goalCircle2[3]} fill="none" stroke="#fff" strokeWidth="2" opacity="0.8"/>}
        {layout.centerCircle&&<circle cx={layout.centerCircle[0]} cy={layout.centerCircle[1]} r={layout.centerCircle[2]} fill="none" stroke="#fff" strokeWidth="2" opacity="0.6"/>}
        {layout.third1&&<rect x={layout.third1[0]} y={layout.third1[1]} width={layout.third1[2]} height={layout.third1[3]} fill="#fff" opacity="0.5"/>}
        {layout.third2&&<rect x={layout.third2[0]} y={layout.third2[1]} width={layout.third2[2]} height={layout.third2[3]} fill="#fff" opacity="0.5"/>}
        {layout.key1&&<rect x={layout.key1[0]} y={layout.key1[1]} width={layout.key1[2]} height={layout.key1[3]} fill="none" stroke="#fff" strokeWidth="1.5" opacity="0.7"/>}
        {layout.key2&&<rect x={layout.key2[0]} y={layout.key2[1]} width={layout.key2[2]} height={layout.key2[3]} fill="none" stroke="#fff" strokeWidth="1.5" opacity="0.7"/>}
        {layout.arc1&&<circle cx={layout.arc1[0]} cy={layout.arc1[1]} r={layout.arc1[2]} fill="none" stroke="#fff" strokeWidth="1.5" opacity="0.5"/>}
        {layout.arc2&&<circle cx={layout.arc2[0]} cy={layout.arc2[1]} r={layout.arc2[2]} fill="none" stroke="#fff" strokeWidth="1.5" opacity="0.5"/>}
        {layout.nvz1&&<rect x={layout.nvz1[0]} y={layout.nvz1[1]} width={layout.nvz1[2]} height={layout.nvz1[3]} fill="none" stroke="#fff" strokeWidth="1.5" opacity="0.5"/>}
        {layout.nvz2&&<rect x={layout.nvz2[0]} y={layout.nvz2[1]} width={layout.nvz2[2]} height={layout.nvz2[3]} fill="none" stroke="#fff" strokeWidth="1.5" opacity="0.5"/>}
        {layout.multi&&<rect x={layout.multi[0]} y={layout.multi[1]} width={layout.multi[2]} height={layout.multi[3]} fill="none" stroke="#fff" strokeWidth="1.5" strokeDasharray="8,4" opacity="0.5"/>}
        <text x={VB[0]/2} y={VB[1]-8} fill="#fff" fontSize="8" fontFamily="Montserrat,sans-serif" fontWeight="700" textAnchor="middle">{layout.label}</text>
        <text x={VB[0]/2} y={VB[1]-1} fill="rgba(255,255,255,0.7)" fontSize="7" textAnchor="middle">{layout.dims}</text>
      </svg>
    </div>
  );
}

function App() {
  const [court, setCourt] = useState('tennis');
  const [colour, setColour] = useState('green');

  const layout = COURTS.find(c=>c.id===court);
  const col = COLOURS.find(c=>c.id===colour);
  const QUOTE_URL = 'https://grandslam-quote-system.vercel.app';

  return (
    <div className="embed">
      <div className="embed-header">🎾 GRAND SLAM SURFACING</div>
      <div className="embed-body">
        <div className="embed-label">1. Choose Your Court</div>
        <div className="court-types">
          {COURTS.map(c=>(
            <button key={c.id} className={`ct-btn ${court===c.id?'selected':''}`} onClick={()=>setCourt(c.id)}>
              <span className="ct-icon">{c.icon}</span>{c.name}
            </button>
          ))}
        </div>

        <div className="embed-label">2. Pick a Colour</div>
        <div className="colour-picker">
          {COLOURS.map(c=>(
            <div key={c.id} className={`col-btn ${colour===c.id?'selected':''}`} onClick={()=>setColour(c.id)}>
              <div className="col-dot" style={{background:c.hex}}></div>
              <span className="col-name">{c.name}</span>
            </div>
          ))}
        </div>

        <div className="embed-label">3. Your Design</div>
        <CourtPreview layout={layout} inside={col?.hex||'#4CAF50'} outside="#888" />

        <a href={QUOTE_URL} target="_blank" className="cta" rel="noreferrer">
          🎾 Get Your Quote →
        </a>
      </div>
      <div className="embed-footer">Professional Sports Court Construction · Since 2008</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
