<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grand Slam Surfacing — Quote System v4</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #1a8a3f; --green-dark: #0f5c28; --green-light: #e8f5e9;
      --orange: #f57c00; --orange-light: #fff3e0; --red: #d32f2f; --red-light: #ffebee;
      --blue: #1565c0; --blue-light: #e3f2fd; --purple: #7b1fa2; --purple-light: #f3e5f5;
      --grey-50: #f9fafb; --grey-100: #f3f4f6; --grey-200: #e5e7eb; --grey-300: #d1d5db;
      --grey-500: #6b7280; --grey-700: #374151; --grey-900: #111827;
      --white: #ffffff; --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--grey-50); color: var(--grey-900); -webkit-font-smoothing: antialiased; }
    .app { max-width: 100%; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: var(--green); color: var(--white); padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
    .header-logo { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 14px; line-height: 1.2; flex:1; }
    .header-sub { font-size: 10px; opacity: 0.8; }
    .badge { font-size: 10px; padding: 3px 8px; border-radius: 12px; font-weight: 600; white-space: nowrap; }
    .btn { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: var(--radius); border: none; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; }
    .btn-sm { font-size: 11px; padding: 5px 10px; }
    .btn-xs { font-size: 10px; padding: 3px 7px; border-radius: 4px; }
    .btn-primary { background: var(--green); color: var(--white); }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-outline { background: var(--white); color: var(--green); border: 1.5px solid var(--green); }
    .btn-outline:hover { background: var(--green-light); }
    .btn-ghost { background: transparent; color: var(--white); border: 1px solid rgba(255,255,255,0.3); }
    .btn-ghost:hover { background: rgba(255,255,255,0.15); }
    .btn-danger { background: var(--red); color: var(--white); }
    .btn-orange { background: var(--orange); color: var(--white); }
    .btn-blue { background: var(--blue); color: var(--white); }
    .btn-purple { background: var(--purple); color: var(--white); }

    /* Bottom nav */
    .bottom-nav { display: flex; background: var(--white); border-top: 2px solid var(--grey-200); position: sticky; bottom: 0; z-index: 50; }
    .nav-item { flex: 1; text-align: center; padding: 10px 4px; font-size: 10px; font-weight: 600; color: var(--grey-500); cursor: pointer; border: none; background: none; font-family: 'Inter', sans-serif; transition: all 0.15s; }
    .nav-item.active { color: var(--green); }
    .nav-item .icon { font-size: 20px; display: block; margin-bottom: 2px; }
    .nav-count { background: var(--red); color: white; font-size: 9px; padding: 1px 5px; border-radius: 8px; position: relative; top: -6px; margin-left: -4px; }

    /* Steps */
    .steps { display: flex; background: var(--white); border-bottom: 1px solid var(--grey-200); }
    .step { flex: 1; text-align: center; padding: 10px 4px; font-size: 9px; font-weight: 600; color: var(--grey-500); position: relative; cursor: pointer; }
    .step.active { color: var(--green); }
    .step.done { color: var(--green-dark); }
    .step::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: transparent; transition: background 0.2s; }
    .step.active::after { background: var(--green); }
    .step.done::after { background: var(--green-light); }
    .step-num { display: block; width: 20px; height: 20px; border-radius: 50%; background: var(--grey-200); color: var(--grey-500); font-size: 10px; font-weight: 700; line-height: 20px; margin: 0 auto 3px; }
    .step.active .step-num { background: var(--green); color: white; }
    .step.done .step-num { background: var(--green-light); color: var(--green-dark); }

    .content { flex: 1; padding: 16px; overflow-y: auto; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--grey-700); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.3px; }
    .form-select, .form-input { width: 100%; padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: 14px; border: 1.5px solid var(--grey-300); border-radius: var(--radius); background: var(--white); color: var(--grey-900); }
    .form-select { appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236b7280' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 32px; }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(26,138,63,0.1); }
    textarea.form-input { resize: vertical; }

    .court-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .court-tile { border: 2px solid var(--grey-200); border-radius: var(--radius); padding: 11px 8px; text-align: center; cursor: pointer; transition: all 0.15s; background: var(--white); font-size: 11px; font-weight: 600; }
    .court-tile.selected { border-color: var(--green); background: var(--green-light); color: var(--green-dark); }
    .court-tile-icon { font-size: 22px; display: block; margin-bottom: 3px; }

    .condition-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .condition-card { border: 2px solid var(--grey-200); border-radius: var(--radius); padding: 12px 6px; text-align: center; cursor: pointer; transition: all 0.15s; background: var(--white); }
    .condition-card.selected { border-color: var(--green); background: var(--green-light); }
    .condition-card .icon { font-size: 26px; display: block; margin-bottom: 3px; }
    .condition-card .label { font-size: 10px; font-weight: 600; }
    .condition-card .hint { font-size: 9px; color: var(--grey-500); margin-top: 2px; }

    .extra-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1.5px solid var(--grey-200); border-radius: var(--radius); margin-bottom: 8px; background: var(--white); cursor: pointer; transition: all 0.15s; }
    .extra-row.selected { border-color: var(--green); background: var(--green-light); }
    .extra-info { display: flex; align-items: center; gap: 10px; }
    .extra-icon { font-size: 20px; }
    .extra-name { font-size: 13px; font-weight: 600; }
    .extra-price { font-size: 12px; font-weight: 700; color: var(--green-dark); }
    .extra-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--grey-300); display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.15s; flex-shrink: 0; }
    .extra-row.selected .extra-check { background: var(--green); border-color: var(--green); color: white; }

    /* Colour swatches */
    .colour-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .colour-swatch { border: 2px solid var(--grey-200); border-radius: var(--radius); padding: 10px; cursor: pointer; transition: all 0.15s; background: var(--white); display: flex; align-items: center; gap: 10px; }
    .colour-swatch.selected { border-color: var(--green); background: var(--green-light); }
    .colour-dot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.1); flex-shrink: 0; }
    .colour-dot.dual { background: none !important; position: relative; overflow: hidden; }
    .colour-dot.dual::after { content: ''; position: absolute; top: 0; right: 0; width: 50%; height: 100%; border-radius: 0 50% 50% 0; }
    .colour-info { flex: 1; min-width: 0; }
    .colour-name { font-size: 12px; font-weight: 600; }
    .colour-tier { font-size: 9px; color: var(--grey-500); }
    .colour-price { font-size: 11px; font-weight: 700; }
    .colour-price.free { color: var(--green-dark); }
    .colour-price.premium { color: var(--orange); }

    /* Court Preview */
    .court-preview { background: var(--white); border: 1.5px solid var(--grey-300); border-radius: var(--radius); overflow: hidden; margin-top: 12px; }
    .court-preview-header { background: var(--grey-900); color: white; text-align: center; padding: 8px; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 0.5px; }
    .court-preview-footer { background: var(--grey-100); text-align: center; padding: 6px; font-size: 10px; color: var(--grey-700); font-weight: 600; }
    .court-preview svg { display: block; width: 100%; height: auto; }
    .court-preview-label { font-size: 8px; fill: #fff; font-family: 'Montserrat', sans-serif; font-weight: 700; text-anchor: middle; }
    .court-preview-dim { font-size: 7px; fill: rgba(255,255,255,0.7); text-anchor: middle; }

    .price-card { background: var(--white); border: 2px solid var(--green); border-radius: var(--radius); padding: 14px; margin-top: 14px; }
    .price-estimate { font-family: 'Montserrat', sans-serif; font-size: 26px; font-weight: 800; color: var(--green-dark); text-align: center; }
    .price-label { font-size: 10px; color: var(--grey-500); text-align: center; margin-bottom: 4px; text-transform: uppercase; }
    .price-note { font-size: 10px; color: var(--grey-500); text-align: center; margin-top: 4px; }
    .price-line { display: flex; justify-content: space-between; padding: 4px 0; font-size: 11px; border-bottom: 1px solid var(--grey-100); }
    .price-line:last-child { border-bottom: none; font-weight: 700; font-size: 12px; }

    .nav-buttons { display: flex; gap: 8px; padding: 16px; background: var(--white); border-top: 1px solid var(--grey-200); }
    .nav-buttons .btn { flex: 1; justify-content: center; }

    /* ── ADMIN PANEL ── */
    .admin-section { padding: 14px; border-bottom: 1px solid var(--grey-200); }
    .admin-section h3 { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .admin-table th { text-align: left; padding: 6px 5px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3px; color: var(--grey-500); border-bottom: 2px solid var(--grey-200); }
    .admin-table td { padding: 5px; border-bottom: 1px solid var(--grey-100); }
    .admin-table input, .admin-table select { width: 100%; padding: 5px 7px; font-size: 11px; border: 1.5px solid var(--grey-300); border-radius: 4px; font-family: 'Inter', sans-serif; }
    .admin-table input:focus { outline: none; border-color: var(--green); }
    .admin-table input[type="number"] { width: 60px; text-align: right; }
    .admin-add-btn { margin-top: 8px; }

    /* ── DASHBOARD ── */
    .dash-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat-card { background: var(--white); border-radius: var(--radius); padding: 12px; text-align: center; border: 1px solid var(--grey-200); }
    .stat-value { font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 800; }
    .stat-label { font-size: 10px; color: var(--grey-500); text-transform: uppercase; margin-top: 2px; }
    .stat-card.green .stat-value { color: var(--green-dark); }
    .stat-card.orange .stat-value { color: var(--orange); }
    .stat-card.blue .stat-value { color: var(--blue); }
    .stat-card.red .stat-value { color: var(--red); }

    .quote-card { background: var(--white); border: 1px solid var(--grey-200); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; transition: all 0.15s; }
    .quote-card:hover { border-color: var(--green); }
    .quote-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .quote-client { font-weight: 700; font-size: 14px; }
    .quote-org { font-size: 11px; color: var(--grey-500); }
    .quote-amount { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 16px; color: var(--green-dark); text-align: right; }
    .quote-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 10px; color: var(--grey-500); margin-bottom: 8px; }
    .quote-meta span { background: var(--grey-100); padding: 2px 8px; border-radius: 10px; }
    .quote-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .status-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 10px; text-transform: uppercase; }
    .status-draft { background: var(--grey-200); color: var(--grey-700); }
    .status-sent { background: var(--blue-light); color: var(--blue); }
    .status-viewed { background: var(--purple-light); color: var(--purple); }
    .status-followup { background: var(--orange-light); color: var(--orange); }
    .status-accepted { background: var(--green-light); color: var(--green-dark); }
    .status-declined { background: var(--red-light); color: var(--red); }
    .status-handedover { background: #e0f7fa; color: #006064; }

    .followup-alert { background: var(--orange-light); border-left: 3px solid var(--orange); padding: 8px 12px; border-radius: 0 var(--radius) var(--radius) 0; margin-top: 8px; font-size: 11px; }

    /* Spec Pack / Handover */
    .spec-section { margin-bottom: 14px; }
    .spec-section h4 { font-size: 12px; font-weight: 700; color: var(--grey-700); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
    .spec-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
    .spec-table th { text-align: left; padding: 6px 8px; background: var(--grey-100); font-size: 10px; font-weight: 600; }
    .spec-table td { padding: 6px 8px; border-bottom: 1px solid var(--grey-200); }
    .checklist-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; border-bottom: 1px solid var(--grey-100); }
    .checklist-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--green); }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--grey-500); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* Modal */
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
    .modal { background: var(--white); border-radius: 16px 16px 0 0; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px 16px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-title { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 800; }

    /* Toast */
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--grey-900); color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 200; animation: toastIn 0.3s ease; }
    @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

    @media (min-width: 600px) {
      .app { max-width: 600px; margin: 0 auto; }
      .court-grid { grid-template-columns: 1fr 1fr 1fr; }
      .header { padding: 14px 24px; }
      .header-logo { font-size: 16px; }
      .content { padding: 20px; }
      .dash-stats { grid-template-columns: repeat(4, 1fr); }
      .price-estimate { font-size: 30px; }
    }
    @media (min-width: 960px) {
      .app { max-width: 800px; border-left: 1px solid var(--grey-200); border-right: 1px solid var(--grey-200); }
      .content { padding: 24px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // ── DEFAULT PRICING ──
    const DEFAULT_PRICING = {
      services: [
        { id: 'resurface', name: 'Court Resurfacing', baseRate: 280, unit: 'per m²' },
        { id: 'construction', name: 'New Court Construction', baseRate: 520, unit: 'per m²' },
        { id: 'equipment', name: 'Sports Equipment Only', baseRate: 0, unit: 'per item' },
      ],
      courtTypes: [
        { id: 'tennis', name: 'Tennis', areaM2: 650, icon: '🎾' },
        { id: 'netball', name: 'Netball', areaM2: 780, icon: '🏐' },
        { id: 'basketball', name: 'Basketball', areaM2: 620, icon: '🏀' },
        { id: 'pickleball', name: 'Pickleball', areaM2: 150, icon: '🏓' },
        { id: 'futsal', name: 'Futsal', areaM2: 800, icon: '⚽' },
        { id: 'combo', name: 'Multi-Purpose', areaM2: 1000, icon: '🏟️' },
      ],
      conditions: [
        { id: 'good', name: 'Good', multiplier: 1.0, icon: '✅', hint: 'Minor wear' },
        { id: 'cracked', name: 'Cracked', multiplier: 1.35, icon: '⚠️', hint: 'Crack repair' },
        { id: 'severe', name: 'Severe', multiplier: 1.8, icon: '🔴', hint: 'Full rebuild' },
      ],
      provinces: [
        { id: 'EC', name: 'Eastern Cape', surcharge: 0 },
        { id: 'WC', name: 'Western Cape', surcharge: 0.12 },
        { id: 'NC', name: 'Northern Cape', surcharge: 0.18 },
        { id: 'FS', name: 'Free State', surcharge: 0.10 },
        { id: 'KZN', name: 'KwaZulu-Natal', surcharge: 0.12 },
        { id: 'GP', name: 'Gauteng', surcharge: 0.15 },
        { id: 'NW', name: 'North West', surcharge: 0.15 },
        { id: 'MP', name: 'Mpumalanga', surcharge: 0.18 },
        { id: 'LP', name: 'Limpopo', surcharge: 0.22 },
      ],
      projectTypes: [
        { id: 'school', name: 'School', warrantyYears: 5 },
        { id: 'club', name: 'Club', warrantyYears: 3 },
        { id: 'corporate', name: 'Corporate', warrantyYears: 5 },
        { id: 'private', name: 'Private', warrantyYears: 3 },
      ],
      extras: [
        { id: 'fencing', name: 'Fencing (3m high)', price: 18000, unit: 'per court', icon: '🏗️' },
        { id: 'lighting', name: 'LED Lighting (6-pole)', price: 45000, unit: 'per court', icon: '💡' },
        { id: 'seating', name: 'Seating (basic)', price: 12000, unit: 'per court', icon: '🪑' },
        { id: 'netposts', name: 'Net Posts & Nets', price: 4500, unit: 'per pair', icon: '🥅' },
      ],
      colours: [
        { id: 'green', name: 'Court Green', hex: '#4CAF50', sports: ['tennis','netball','basketball','pickleball','futsal','combo'], surcharge: 0, tier: 'standard' },
        { id: 'terracotta', name: 'Terracotta', hex: '#CC6644', sports: ['tennis'], surcharge: 6000, tier: 'premium' },
        { id: 'blue', name: 'Court Blue', hex: '#2196F3', sports: ['tennis','netball','pickleball','combo'], surcharge: 2500, tier: 'standard' },
        { id: 'red', name: 'Sport Red', hex: '#E53935', sports: ['netball','basketball','futsal','combo'], surcharge: 2500, tier: 'standard' },
        { id: 'dark_green', name: 'Dark Green', hex: '#2E7D32', sports: ['tennis','netball','futsal','combo'], surcharge: 1500, tier: 'standard' },
        { id: 'grey', name: 'Slate Grey', hex: '#607D8B', sports: ['tennis','basketball','combo'], surcharge: 0, tier: 'standard' },
        { id: 'two_tone', name: 'Two-Tone (Green/Terracotta)', hex: '#4CAF50', hex2: '#CC6644', sports: ['tennis'], surcharge: 9000, tier: 'premium' },
        { id: 'blue_green', name: 'Blue/Green Combo', hex: '#2196F3', hex2: '#4CAF50', sports: ['netball','combo'], surcharge: 7500, tier: 'premium' },
        { id: 'custom_school', name: 'Custom School Colours', hex: 'linear-gradient(135deg, #333 0%, #666 100%)', sports: ['tennis','netball','basketball','combo'], surcharge: 15000, tier: 'custom' },
      ],
    };

    // ── PRICING ENGINE ──
    function calculatePrice(selections, pricing) {
      const { service, courtTypes, courtCount, condition, province, extras, colour } = selections;
      if (!service || !courtTypes.length || !condition || !province) return null;
      const svc = pricing.services.find(s => s.id === service);
      const cond = pricing.conditions.find(c => c.id === condition);
      const prov = pricing.provinces.find(p => p.id === province);
      let totalArea = 0, courtBreakdown = [];
      courtTypes.forEach(ctId => {
        const ct = pricing.courtTypes.find(c => c.id === ctId);
        if (ct) { const a = ct.areaM2 * (parseInt(courtCount) || 1); totalArea += a; courtBreakdown.push({ name: ct.name, icon: ct.icon, count: parseInt(courtCount)||1, areaPer: ct.areaM2, totalArea: a }); }
      });
      let subtotal = svc.baseRate * totalArea;
      const breakdown = [{ label: `${svc.name} (${totalArea}m² × R${svc.baseRate}/m²)`, amount: subtotal }];
      if (cond.multiplier !== 1.0) { const ca = subtotal * (cond.multiplier-1); subtotal *= cond.multiplier; breakdown.push({ label: `Condition: ${cond.name} (+${Math.round((cond.multiplier-1)*100)}%)`, amount: Math.round(ca) }); }
      if (prov.surcharge > 0) { const sa = subtotal * prov.surcharge; subtotal += sa; breakdown.push({ label: `Province: ${prov.name} (+${Math.round(prov.surcharge*100)}%)`, amount: Math.round(sa) }); }
      const totalCourts = (parseInt(courtCount)||1) * courtTypes.length;
      let vd = 0;
      if (totalCourts >= 5) { vd = Math.round(subtotal * 0.07); breakdown.push({ label: `Volume discount (${totalCourts} courts, 7%)`, amount: -vd }); }
      let et=0; extras.forEach(eid => { const ex = pricing.extras.find(e=>e.id===eid); if(ex){ const ec=ex.price*totalCourts; et+=ec; breakdown.push({label:`${ex.name} (${totalCourts}× R${ex.price.toLocaleString()})`,amount:ec});}});
      // Colour surcharge
      let colourCost = 0;
      if (colour) {
        const col = pricing.colours.find(c=>c.id===colour);
        if (col && col.surcharge > 0) { colourCost = col.surcharge * totalCourts; breakdown.push({label:`Colour: ${col.name} (${totalCourts}× R${col.surcharge.toLocaleString()})`,amount:colourCost}); }
        else if (col) { breakdown.push({label:`Colour: ${col.name} (included)`,amount:0}); }
      }
      const pv = subtotal-vd+et+colourCost, vat = Math.round(pv*0.15), total = pv+vat;
      return { subtotal:Math.round(subtotal), volumeDiscount:vd, extrasTotal:et, preVat:Math.round(pv), vat, total, totalCourts, totalArea, breakdown, courtBreakdown };
    }

            )}

            <div style={{marginTop:14}}>
              <div className="form-group"><label className="form-label">Client / Organisation Name *</label><input className="form-input" placeholder="e.g. Pearson High School" value={selections.name} onChange={e=>update('name',e.target.value)}/></div>
              <div className="form-group"><label className="form-label">Contact Person</label><input className="form-input" placeholder="Full name" value={selections.contact||''} onChange={e=>update('contact',e.target.value)}/></div>
              <div className="form-group"><label className="form-label">Email</label><input className="form-input" type="email" placeholder="email@example.com" value={selections.email} onChange={e=>update('email',e.target.value)}/></div>
              <div className="form-group"><label className="form-label">Phone *</label><input className="form-input" type="tel" placeholder="082 123 4567" value={selections.phone} onChange={e=>update('phone',e.target.value)}/></div>
              <div className="form-group"><label className="form-label">Site Address</label><input className="form-input" placeholder="Physical location of courts" value={selections.address||''} onChange={e=>update('address',e.target.value)}/></div>
              <div className="form-group"><label className="form-label">Notes</label><textarea className="form-input" rows="3" placeholder="Any specific requirements, tender deadlines, etc." value={selections.message} onChange={e=>update('message',e.target.value)}/></div>
            </div>
          </div>)}
        </div>
        <div className="nav-buttons">
          {step>1 && <button className="btn btn-outline" onClick={()=>setStep(s=>s-1)}>← Back</button>}
          {step<4 ? <button className="btn btn-primary" onClick={()=>canNext()&&setStep(s=>s+1)} disabled={!canNext()}>Continue →</button>
          : <button className="btn btn-primary" onClick={handleSubmit} disabled={!selections.name||!selections.phone}>📩 Send Quote</button>}
        </div>
      </div>);
    }

    // ── SPEC PACK / HANDOVER MODAL ──
    function HandoverModal({ quote, pricing, onClose, onConfirm }) {
      const pt = pricing.projectTypes.find(p=>p.id===quote.projectType);
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-header"><div className="modal-title">📋 Handover to Site Team</div><button className="btn btn-sm btn-outline" onClick={onClose}>✕</button></div>

            <div className="spec-section">
              <h4>Job Details</h4>
              <table className="spec-table">
                <tbody>
                  <tr><td style={{fontWeight:600}}>Client</td><td>{quote.name}</td></tr>
                  <tr><td style={{fontWeight:600}}>Quote Ref</td><td>{quote.id}</td></tr>
                  <tr><td style={{fontWeight:600}}>Site</td><td>{quote.address || 'TBC'}</td></tr>
                  <tr><td style={{fontWeight:600}}>Province</td><td>{pricing.provinces.find(p=>p.id===quote.province)?.name}</td></tr>
                  <tr><td style={{fontWeight:600}}>Project Type</td><td>{pt?.name} — {pt?.warrantyYears}-year warranty</td></tr>
                </tbody>
              </table>
            </div>

            <div className="spec-section">
              <h4>Courts</h4>
              <table className="spec-table"><thead><tr><th>Court</th><th>Count</th><th>Area</th><th>Total</th></tr></thead><tbody>
                {quote.quote?.courtBreakdown.map((cb,i)=><tr key={i}><td>{cb.icon} {cb.name}</td><td>{cb.count}</td><td>{cb.areaPer}m²</td><td>{cb.totalArea}m²</td></tr>)}
              </tbody></table>
            </div>

            <div className="spec-section">
              <h4>Installation Checklist</h4>
              <div className="checklist-item"><input type="checkbox"/> Materials delivered to site</div>
              <div className="checklist-item"><input type="checkbox"/> Plant & equipment hired</div>
              <div className="checklist-item"><input type="checkbox"/> Crew briefed on spec</div>
              <div className="checklist-item"><input type="checkbox"/> Client access confirmed</div>
              <div className="checklist-item"><input type="checkbox"/> Weather window checked (48h no rain)</div>
              <div className="checklist-item"><input type="checkbox"/> Surface prep: Pressure wash + crack repair</div>
              <div className="checklist-item"><input type="checkbox"/> Acrylic coats applied & cured</div>
              <div className="checklist-item"><input type="checkbox"/> Line marking per spec</div>
              <div className="checklist-item"><input type="checkbox"/> Equipment installed (posts, fencing, lighting)</div>
              <div className="checklist-item"><input type="checkbox"/> Client walkthrough & sign-off</div>
              <div className="checklist-item"><input type="checkbox"/> Warranty certificate issued</div>
              <div className="checklist-item"><input type="checkbox"/> Site cleaned, waste removed</div>
            </div>

            {quote.extras?.length > 0 && <div className="spec-section">
              <h4>Extras to Install</h4>
              {quote.extras.map(eid=>{const ex=pricing.extras.find(e=>e.id===eid); return ex?<div key={eid} style={{padding:'4px 0',fontSize:12}}>{ex.icon} {ex.name} — {quote.quote?.totalCourts}× R{ex.price.toLocaleString()}</div>:null;})}
            </div>}

            <div style={{display:'flex',gap:8,marginTop:16}}>
              <button className="btn btn-outline" style={{flex:1}} onClick={onClose}>Cancel</button>
              <button className="btn btn-purple" style={{flex:1}} onClick={()=>{onConfirm(quote.id); onClose();}}>✅ Confirm Handover</button>
            </div>
          </div>
        </div>
      );
    }

    // ── QUOTES DASHBOARD ──
    function QuotesDashboard({ quotes, pricing, onUpdateQuote, onDeleteQuote }) {
      const [filter, setFilter] = useState('all');
      const [handoverQuote, setHandoverQuote] = useState(null);
      const [toast, setToast] = useState(null);

      const filtered = filter==='all' ? quotes : quotes.filter(q=>q.status===filter);
      const stats = {
        total: quotes.length,
        sent: quotes.filter(q=>q.status==='sent'||q.status==='viewed').length,
        accepted: quotes.filter(q=>q.status==='accepted'||q.status==='handedover').length,
        value: quotes.filter(q=>q.status==='accepted'||q.status==='handedover').reduce((s,q)=>s+(q.quote?.total||0),0),
      };

      const overdueFollowups = quotes.filter(q=>q.followUpDate && new Date(q.followUpDate) < new Date() && q.status==='sent');

      const updateStatus = (q, newStatus) => {
        const updates = { status: newStatus };
        if (newStatus==='viewed') updates.viewedAt = new Date().toISOString();
        if (newStatus==='accepted') updates.acceptedAt = new Date().toISOString();
        if (newStatus==='declined') updates.declinedAt = new Date().toISOString();
        onUpdateQuote(q.id, updates);
        setToast(`${STATUS_LABELS[newStatus]}: ${q.name}`);
      };

      const setFollowUp = (q) => {
        const date = prompt('Set follow-up date (YYYY-MM-DD):', q.followUpDate?.split('T')[0] || new Date(Date.now()+7*86400000).toISOString().split('T')[0]);
        if (date) { onUpdateQuote(q.id, { followUpDate: new Date(date).toISOString(), status: 'sent' }); setToast(`Follow-up set for ${date}`); }
      };

      const formatDate = d => d ? new Date(d).toLocaleDateString('en-ZA', {day:'numeric',month:'short'}) : '—';

      return (<div>
        {toast && <Toast msg={toast} onDone={()=>setToast(null)}/>}
        {handoverQuote && <HandoverModal quote={handoverQuote} pricing={pricing} onClose={()=>setHandoverQuote(null)} onConfirm={id=>{onUpdateQuote(id,{status:'handedover',handedOverAt:new Date().toISOString()});setToast('Handed over to site team! 🏗️');}}/>}

        <div className="dash-stats">
          <div className="stat-card blue"><div className="stat-value">{stats.total}</div><div className="stat-label">Total Quotes</div></div>
          <div className="stat-card orange"><div className="stat-value">{stats.sent}</div><div className="stat-label">Outstanding</div></div>
          <div className="stat-card green"><div className="stat-value">{stats.accepted}</div><div className="stat-label">Won</div></div>
          <div className="stat-card green"><div className="stat-value">R{(stats.value/1000).toFixed(0)}k</div><div className="stat-label">Pipeline Value</div></div>
        </div>

        {overdueFollowups.length > 0 && <div className="followup-alert" style={{marginBottom:12}}>
          ⚠️ <strong>{overdueFollowups.length} follow-up{overdueFollowups.length>1?'s':''} overdue:</strong> {overdueFollowups.map(q=>q.name).join(', ')}
        </div>}

        <div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
          {['all','sent','viewed','accepted','declined','handedover'].map(s=>(
            <button key={s} className={`btn ${filter===s?'btn-primary':'btn-outline'} btn-xs`} onClick={()=>setFilter(s)}>
              {s==='all'?'All':STATUS_LABELS[s]} {s!=='all'&&<span style={{fontSize:9,marginLeft:2}}>({quotes.filter(q=>q.status===s).length})</span>}
            </button>
          ))}
        </div>

        {filtered.length===0 && <div className="empty-state"><div className="empty-icon">📭</div><div style={{fontWeight:600,marginBottom:4}}>No quotes yet</div><div>Create one from the Quote tab ↑</div></div>}

        {filtered.map(q=>(
          <div key={q.id} className="quote-card">
            <div className="quote-header">
              <div>
                <div className="quote-client">{q.name}</div>
                <div className="quote-org">{q.contact||'No contact'} · {q.phone} · {q.email||'No email'}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div className="quote-amount">R{q.quote?.total?.toLocaleString()||'—'}</div>
                <span className={`status-badge ${STATUS_CLASS[q.status]}`}>{STATUS_LABELS[q.status]}</span>
              </div>
            </div>
            <div className="quote-meta">
              <span>{q.quote?.totalCourts||'?'} courts</span>
              <span>{q.quote?.totalArea||'?'}m²</span>
              <span>{pricing.services.find(s=>s.id===q.service)?.name||q.service}</span>
              <span>{pricing.provinces.find(p=>p.id===q.province)?.name||q.province}</span>
              <span>Created {formatDate(q.createdAt)}</span>
              {q.followUpDate && <span style={{background:new Date(q.followUpDate)<new Date()?'var(--red-light)':'var(--grey-100)'}}>📅 Follow-up: {formatDate(q.followUpDate)}</span>}
            </div>
            <div className="quote-actions">
              {q.status==='sent' && <>
                <button className="btn btn-sm btn-outline" onClick={()=>updateStatus(q,'viewed')}>👁 Mark Viewed</button>
                <button className="btn btn-sm btn-orange" onClick={()=>setFollowUp(q)}>📅 Follow-up</button>
              </>}
              {['sent','viewed'].includes(q.status) && <>
                <button className="btn btn-sm btn-primary" onClick={()=>updateStatus(q,'accepted')}>✅ Accept</button>
                <button className="btn btn-sm btn-danger" onClick={()=>updateStatus(q,'declined')}>❌ Decline</button>
              </>}
              {q.status==='accepted' && <>
                <button className="btn btn-sm btn-purple" onClick={()=>setHandoverQuote(q)}>🏗️ Handover to Site</button>
              </>}
              {q.status==='declined' && <span style={{fontSize:11,color:'var(--grey-500)'}}>Declined {formatDate(q.declinedAt)}</span>}
              {q.status==='handedover' && <span style={{fontSize:11,color:'#006064'}}>✅ Handed over {formatDate(q.handedOverAt)} · Site team notified</span>}
              <button className="btn btn-xs btn-ghost" style={{color:'var(--grey-500)',marginLeft:'auto'}} onClick={()=>{if(confirm('Delete this quote?'))onDeleteQuote(q.id);}}>🗑</button>
            </div>
          </div>
        ))}
      </div>);
    }

    // ── MAIN APP ──
    function App() {
      const [view, setView] = useState('quote');
      const [pricing, setPricing] = useState(()=>loadPricing());
      const [quotes, setQuotes] = useState(()=>loadQuotes());

      useEffect(()=>{savePricing(pricing)},[pricing]);
      useEffect(()=>{saveQuotes(quotes)},[quotes]);

      const handleQuoteSubmit = (q) => { setQuotes(prev=>[q,...prev]); };
      const handleUpdateQuote = (id, updates) => { setQuotes(prev=>prev.map(q=>q.id===id?{...q,...updates}:q)); };
      const handleDeleteQuote = (id) => { setQuotes(prev=>prev.filter(q=>q.id!==id)); };

      const pendingCount = quotes.filter(q=>q.status==='sent').length;

      return (<div className="app">
        <div className="header">
          <div style={{flex:1}}><div className="header-logo">🎾 Grand Slam Surfacing</div><div className="header-sub">Quote & Project Manager</div></div>
          {view==='quote' && <span className="badge" style={{background:'rgba(255,255,255,0.2)'}}>Quote</span>}
          {view==='quotes' && <span className="badge" style={{background:'rgba(255,255,255,0.2)'}}>{quotes.length} quotes</span>}
          {view==='admin' && <span className="badge" style={{background:'rgba(255,255,255,0.2)'}}>Admin</span>}
        </div>

        {view==='quote' && <QuoteWizard pricing={pricing} onQuoteSubmit={handleQuoteSubmit}/>}
        {view==='quotes' && <div className="content"><QuotesDashboard quotes={quotes} pricing={pricing} onUpdateQuote={handleUpdateQuote} onDeleteQuote={handleDeleteQuote}/></div>}
        {view==='admin' && <AdminPanel pricing={pricing} onUpdate={setPricing}/>}

        <div className="bottom-nav">
          <button className={`nav-item ${view==='quote'?'active':''}`} onClick={()=>setView('quote')}><span className="icon">📝</span>New Quote</button>
          <button className={`nav-item ${view==='quotes'?'active':''}`} onClick={()=>setView('quotes')}>
            <span className="icon">📊</span>Quotes {pendingCount>0 && <span className="nav-count">{pendingCount}</span>}
          </button>
          <button className={`nav-item ${view==='admin'?'active':''}`} onClick={()=>setView('admin')}><span className="icon">⚙️</span>Pricing</button>
        </div>
      </div>);
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
